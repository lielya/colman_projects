<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Sign Up</title>
  <link rel="shortcut icon" href="./images/netflix_assets/netflix_favicon.png">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    /* רקע מלא */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: url('https://assets.nflxext.com/ffe/siteui/vlv3/a1dc92ca-091d-4ca9-a05b-8cd44bbfce6a/f9368347-e982-4856-a5a4-396796381f28/RS-en-20191230-popsignuptwoweeks-perspective_alpha_website_large.jpg')
        center center / cover no-repeat;
      position: relative;
      min-height: 100vh;
      color: white;
    }

    /* שכבת הצללה */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      background-image: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.8) 100%);
      z-index: 0;
    }

    .register-box-bg {
      position: relative;
      z-index: 1;
    }

    /* לוגו נטפליקס */
    .netflix-logo {
      width: 150px;
      margin: 25px 0 10px 25px;
    }

    /* קופסה של טופס ההרשמה */
    .register-box {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 60px 68px 40px;
      border-radius: 6px;
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      margin-top: 30px;
    }

    .register-box h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 28px;
      text-align: center;
    }

    .form-control {
      background-color: #333;
      border: none;
      border-radius: 4px;
      color: #fff;
      height: 50px;
      padding: 10px 16px;
    }

    .form-control:focus {
      background-color: #444;
      border: 1px solid #e50914;
      box-shadow: none;
      color: #fff;
    }

    .form-control::placeholder {
      color: #b3b3b3;
    }

    .btn-sign-up {
      background-color: #e50914;
      border: none;
      color: #fff;
      font-weight: 600;
      height: 50px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 4px;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn-sign-up:hover {
      background-color: #f6121d;
    }

    .signin-text {
      color: #b3b3b3;
      font-size: 16px;
      text-align: center;
    }

    .signin-text a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .signin-text a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #e87c03;
      font-size: 14px;
      margin-top: 4px;
    }

    .small.text-muted {
      font-size: 12px;
      color: #8c8c8c !important;
      text-align: center;
    }

    .small.text-muted a {
      color: #8c8c8c;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-box-bg">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <img src="https://www.freepnglogos.com/uploads/netflix-logo-0.png" alt="Netflix" class="netflix-logo">
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="register-box">
            <h1>Sign up</h1>
            <form id="registerForm">
              <div class="mb-3">
                <input id="emailInput" type="email" class="form-control" placeholder="Email address" required>
                <div id="emailError" class="error-message"></div>
              </div>
              <div class="mb-3">
                <input id="usernameInput" type="text" class="form-control" placeholder="Username" required>
                <div id="usernameError" class="error-message"></div>
              </div>
              <div class="mb-3">
                <input type="password" id="passwordInput" class="form-control" placeholder="Password" required>
                <div id="passwordError" class="error-message"></div>
              </div>
              <div class="mb-3">
                <input type="password" id="confirmPasswordInput" class="form-control" placeholder="Confirm Password" required>
                <div id="confirmPasswordError" class="error-message"></div>
              </div>
              <button type="submit" class="btn btn-sign-up">Sign Up</button>
              <div class="signin-text mt-4">
                Already have an account? <a href="/login">Sign in now</a>.
              </div>
              <div class="mt-3 small text-muted">
                This page is protected by Google reCAPTCHA to ensure you're not a bot.
                <a href="#" class="text-muted">Learn more.</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- JavaScript -->
  <script src="./js/register.js"></script>
</body>
</html>
