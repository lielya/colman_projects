<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-R" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix - Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    body {
      background-color: #141414;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 20px 0;
    }
    .netflix-logo { height: 45px; margin-bottom: 20px; }

    .profiles-container { text-align: center; max-width: 90%; margin: 0 auto; }
    .profiles-title { font-size: 3.5vw; color: #fff; font-weight: 400; margin-bottom: 30px; }
    @media (max-width: 768px) {
      .profiles-title { font-size: 2rem; }
    }

    .profiles-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2vw;
      margin-bottom: 40px;
    }
    .profile {
      cursor: pointer;
      transition: all 0.3s ease;
      width: 10vw;
      min-width: 84px;
      max-width: 200px;
      position: relative;
    }
    .profile:hover { transform: scale(1.1); }
    .profile.manage-mode { cursor: default; }
    .profile.manage-mode:hover { transform: none; }

    .profile-avatar {
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .profile-name-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: #808080;
      font-size: max(12px, 1.3vw);
      text-align: center;
      outline: none;
      transition: color 0.3s ease, border-color 0.2s ease, background-color 0.2s ease;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .profile:hover .profile-name-input { color: #fff; }
    .profile-name-input:focus {
      color: #fff;
      border-color: #999;
      background-color: rgba(255,255,255,0.06);
    }
    .profile-name-input:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .profile-actions {
      display: none;
      gap: 8px;
      margin-top: 8px;
    }
    .profile.manage-mode .profile-actions {
      display: flex;
      justify-content: center;
    }
    .btn-profile-action {
      padding: 4px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-edit {
      background: transparent;
      color: #4CAF50;
      border-color: #4CAF50;
    }
    .btn-edit:hover {
      background: #4CAF50;
      color: #fff;
    }
    .btn-delete {
      background: transparent;
      color: #e50914;
      border-color: #e50914;
    }
    .btn-delete:hover {
      background: #e50914;
      color: #fff;
    }

    .btn-manage-profiles {
      background-color: transparent;
      color: #808080;
      border: 1px solid #808080;
      padding: 8px 24px;
      font-size: max(12px, 1.2vw);
      letter-spacing: 2px;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .btn-manage-profiles:hover { 
      color: #fff; 
      border-color: #fff; 
    }
    .btn-manage-profiles.active {
      color: #e50914;
      border-color: #e50914;
    }

    .btn-add-profile {
      background-color: transparent;
      color: #808080;
      border: 1px solid #808080;
      padding: 8px 24px;
      font-size: max(12px, 1.2vw);
      letter-spacing: 2px;
      margin-top: 20px;
      margin-left: 10px;
      transition: all 0.3s ease;
    }
    .btn-add-profile:hover { 
      color: #fff; 
      border-color: #fff; 
    }
    .btn-add-profile:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Statistics Section */
    .stats-section {
      margin-top: 60px;
      padding: 30px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
    }
    .stats-title {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #fff;
    }
    .chart-container {
      position: relative;
      height: 400px;
      margin-bottom: 40px;
    }
    .chart-container canvas {
      max-height: 100%;
    }

    /* Modal Styles */
    .modal-content {
      background-color: #181818;
      color: #fff;
      border: 1px solid #333;
    }
    .modal-header {
      border-bottom: 1px solid #333;
    }
    .modal-footer {
      border-top: 1px solid #333;
    }
    .form-control, .form-control:focus {
      background-color: #222;
      color: #fff;
      border-color: #444;
    }
    .form-control:focus {
      border-color: #e50914;
      box-shadow: 0 0 0 0.2rem rgba(229, 9, 20, 0.25);
    }
    .btn-close {
      filter: invert(1);
    }

    /* --- NEW AVATAR PICKER CSS --- */
    .avatar-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 15px; /* Space between avatars */
      padding-top: 10px;
      justify-content: center; /* Center the avatars */
    }

    /* Hide the actual radio button */
    .avatar-picker input[type="radio"] {
      display: none;
    }

    .avatar-picker img {
      width: 80px; /* Smaller for the modal */
      height: 80px;
      border-radius: 8px;
      cursor: pointer;
      border: 4px solid transparent; /* Placeholder for selection */
      transition: all 0.2s ease;
    }

    .avatar-picker img:hover {
      transform: scale(1.05);
    }

    /* Style the selected image */
    .avatar-picker input[type="radio"]:checked + img {
      border-color: #fff; /* Highlight color */
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }
    /* --- END NEW CSS --- */

  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 text-center mb-5">
        <img src="https://www.freepnglogos.com/uploads/netflix-logo-0.png" alt="Netflix" class="netflix-logo">
      </div>
    </div>

    <div class="profiles-container">
      <h1 class="profiles-title">Who's watching?</h1>

      <form action="#" method="get" class="profiles-list" novalidate>
        <p style="color: #808080; width: 100%;">Loading profiles...</p>
      </form>

      <div class="text-center">
        <button class="btn btn-manage-profiles" type="button" id="manageBtn">MANAGE PROFILES</button>
        <button class="btn btn-add-profile" type="button" id="addProfileBtn" disabled>ADD PROFILE</button>
      </div>

      <div class="stats-section">
        <h2 class="stats-title">Statistics</h2>
        
        <div class="chart-container">
          <canvas id="dailyViewsChart"></canvas>
        </div>

        <div class="chart-container">
          <canvas id="genrePopularityChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="profileModalTitle">Add Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="profileForm">
            <div class="mb-3">
              <label for="profileName" class="form-label">Profile Name</label>
              <input type="text" class="form-control" id="profileName" maxlength="20" required>
              <div class="form-text" style="color: #808080;">Maximum 20 characters</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Choose an Avatar:</label>
              
              <div class="avatar-picker">
                
                <label>
                  <input type="radio" name="profileAvatar" value="/images/avatars/avatar1.png" checked>
                  <img src="/images/avatars/avatar1.png" alt="Avatar 1">
                </label>
            
                <label>
                  <input type="radio" name="profileAvatar" value="/images/avatars/avatar2.png">
                  <img src="/images/avatars/avatar2.png" alt="Avatar 2">
                </label>
            
                <label>
                  <input type="radio" name="profileAvatar" value="/images/avatars/avatar3.png">
                  <img src="/images/avatars/avatar3.png" alt="Avatar 3">
                </label>
            
                <label>
                  <input type="radio" name="profileAvatar" value="/images/avatars/avatar4.png">
                  <img src="/images/avatars/avatar4.png" alt="Avatar 4">
                </label>
            
                <label>
                  <input type="radio" name="profileAvatar" value="/images/avatars/avatar5.png">
                  <img src="/images/avatars/avatar5.png" alt="Avatar 5">
                </label>
            
                <label>
                  <input type="radio" name="profileAvatar" value="/images/avatars/avatar6.png">
                  <img src="/images/avatars/avatar6.png" alt="Avatar 6">
                </label>
            
              </div>
            </div>
            </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="saveProfileBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/profiles.js"></script>
</body>
</html>
