<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Admin: Add Content</title>
    
    <link rel="icon" href="/images/netflix-logo-icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://assets.nflxext.com/ffe/siteui/vlv3/a1dc92ca-091d-4ca9-a05b-8cd44bbfce6a/f9368347-e982-4856-a5a4-396796381f28/RS-en-20191230-popsignuptwoweeks-perspective_alpha_website_large.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0; 
        }
        .admin-container {
            background-color: rgba(0, 0, 0, 0.85); 
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            max-width: 800px; 
            width: 100%;
            margin: auto;
        }
        .admin-container h1 {
            color: #E50914; 
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .admin-container .logo {
            display: block;
            margin: 0 auto 20px auto;
            width: 120px;
        }
        .form-label, .col-form-label { color: #ccc; font-weight: 500; }
        @media (min-width: 576px) { 
            .col-form-label { text-align: right; padding-right: 0; }
        }
        .form-control, .form-select {
            background-color: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 10px 15px;
            border-radius: 4px;
        }
        .form-control:read-only { background-color: #555; }
        .form-control:focus, .form-select:focus {
            background-color: #444;
            border-color: #E50914;
            box-shadow: 0 0 0 0.25rem rgba(229, 9, 20, 0.25);
            color: #fff;
        }
        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover, 
        .form-control:-webkit-autofill:focus,
        .form-control:-webkit-autofill:active  {
            -webkit-box-shadow: 0 0 0 30px #333 inset !important;
            -webkit-text-fill-color: #fff !important;
        }
        .btn-netflix {
            background-color: #E50914; border-color: #E50914; color: #fff;
            padding: 12px 25px; font-size: 1.1rem; font-weight: 600;
            border-radius: 4px; transition: background-color 0.3s ease;
            width: 100%; margin-top: 20px;
        }
        .btn-netflix:hover {
            background-color: #F40612; border-color: #F40612; color: #fff;
        }
        .alert-message {
            margin-top: 20px; text-align: center; padding: 10px;
            border-radius: 5px; font-weight: bold; word-wrap: break-word; 
        }
        .alert-success { background-color: #28a745; color: #fff; }
        .alert-danger { background-color: #dc3545; color: #fff; }
        @media (max-width: 768px) {
            body { padding: 15px; align-items: flex-start; }
            .admin-container { padding: 25px; }
            .admin-container h1 { font-size: 1.8rem; }
        }
        .conditional-field { display: none; }

        .episode-entry {
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .episode-entry h5 {
            color: #E50914;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-remove-episode {
            font-size: 0.8rem;
            padding: 2px 8px;
        }
        .btn-outline-secondary {
            color: #ccc;
            border-color: #555;
        }
        .btn-outline-secondary:hover {
            color: #fff;
            background-color: #555;
            border-color: #555;
        }
    </style>
</head>
<body>
    
    <div class="admin-container">
        <img src="/images/netflix-logo-full.png" alt="Netflix Logo" class="logo">
        <h1>Add New Content</h1>

        <form id="addContentForm" enctype="multipart/form-data">

            <div class="row mb-3 align-items-center">
                <label for="uniqueId" class="col-sm-3 col-form-label">Unique ID</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="uniqueId" name="id" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="title" class="col-sm-3 col-form-label">Content Title</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="type" class="col-sm-3 col-form-label">Type</label>
                <div class="col-sm-9">
                    <select class="form-select" id="type" name="type" required>
                        <option value="">Select Type</option>
                        <option value="movie">Movie</option>
                        <option value="series">Series</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="year" class="col-sm-3 col-form-label">Release Year</label>
                <div class="col-sm-9">
                    <input type="number" class="form-control" id="year" name="year" min="1900" max="2099" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="category" class="col-sm-3 col-form-label">Category (Genre)</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="category" name="category" placeholder="e.g., Action, Drama, Comedy" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="director" class="col-sm-3 col-form-label">Director</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" id="director" name="director">
                </div>
            </div>
            <div class="row mb-3"> 
                <label for="info" class="col-sm-3 col-form-label">Info (Summary)</label>
                <div class="col-sm-9">
                    <textarea class="form-control" id="info" name="info" rows="3" required></textarea>
                </div>
            </div>
            <hr style="border-color: #444; margin: 25px 0;">
            <div class="row mb-3">
                <label for="actors_names" class="col-sm-3 col-form-label">Actor Names<br><small>(one per line)</small></label>
                <div class="col-sm-9">
                    <textarea class="form-control" id="actors_names" name="actors_names" rows="3"></textarea>
                </div>
            </div>
            <div class="row mb-3">
                <label for="actors_urls" class="col-sm-3 col-form-label">Actor URLs<br><small>(one per line)</small></label>
                <div class="col-sm-9">
                    <textarea class="form-control" id="actors_urls" name="actors_urls" rows="3" placeholder="Must match order of names"></textarea>
                </div>
            </div>
            <hr style="border-color: #444; margin: 25px 0;">
            <div class="row mb-3 align-items-center">
                <label for="posterImage" class="col-sm-3 col-form-label">Poster Image</label>
                <div class="col-sm-9">
                    <input class="form-control" type="file" id="posterImage" name="posterImage" accept="image/*" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="backdropImage" class="col-sm-3 col-form-label">Backdrop Image</label>
                <div class="col-sm-9">
                    <input class="form-control" type="file" id="backdropImage" name="backdropImage" accept="image/*" required>
                </div>
            </div>
            <div id="movie-video-upload" class="row mb-3 align-items-center conditional-field">
                <label for="videoFile" class="col-sm-3 col-form-label">Video File (MP4)</label>
                <div class="col-sm-9">
                    <input class="form-control" type="file" id="videoFile" name="videoFile" accept="video/mp4" required>
                </div>
            </div>
            
            <div id="series-episodes-section" class="conditional-field">
                <h4>Episodes</h4>
                <div id="episode-entry-list">
                    </div>
                <button type="button" id="add-episode-btn" class="btn btn-outline-secondary mt-2">
                    <i class="bi bi-plus-circle"></i> Add Episode
                </button>
            </div>
            <button type="submit" class="btn btn-netflix">Add Content</button>
            <div id="message" class="alert-message d-none"></div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let episodeCounter = 0; 

        function addEpisodeRow() {
            episodeCounter++;
            const list = document.getElementById('episode-entry-list');
            
            const newEpisode = document.createElement('div');
            newEpisode.className = 'episode-entry';
            newEpisode.id = `episode-entry-${episodeCounter}`;
            
            newEpisode.innerHTML = `
                <h5>
                    Episode ${episodeCounter}
                    <button type="button" class="btn btn-danger btn-sm btn-remove-episode" onclick="removeEpisodeRow('episode-entry-${episodeCounter}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label small">Season Number</label>
                        <input type="number" name="episode_season[]" class="form-control form-control-sm" value="1" min="1" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small">Episode Number</label>
                        <input type="number" name="episode_number[]" class="form-control form-control-sm" value="${episodeCounter}" min="1" required>
                    </div>
                </div>
                <div class="mt-2">
                    <label class="form-label small">Episode Title</label>
                    <input type="text" name="episode_title[]" class="form-control form-control-sm" required>
                </div>
                <div class="mt-2">
                    <label class="form-label small">Description</label>
                    <textarea name="episode_description[]" class="form-control form-control-sm" rows="2" required></textarea>
                </div>
                <div class="mt-2">
                    <label class="form-label small">Video File (MP4)</label>
                    <input type="file" name="episode_video[]" class="form-control form-control-sm" accept="video/mp4" required>
                </div>
                <div class="mt-2">
                    <label class="form-label small">Thumbnail URL</label>
                    <input type="text" name="episode_thumbnail[]" class="form-control form-control-sm" placeholder="http://.../image.jpg" required>
                </div>
                <div class="row g-2 mt-1">
                    <div class="col-md-6">
                        <label class="form-label small">Duration (seconds)</label>
                        <input type="number" name="episode_duration[]" class="form-control form-control-sm" min="1" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small">Air Date</label>
                        <input type="date" name="episode_airDate[]" class="form-control form-control-sm" required>
                    </div>
                </div>
            `;
            
            list.appendChild(newEpisode);
        }

        function removeEpisodeRow(elementId) {
            const row = document.getElementById(elementId);
            if (row) {
                row.remove();
            }
        }

        function handleTypeChange() {
            const type = document.getElementById('type').value;
            const movieSection = document.getElementById('movie-video-upload');
            const seriesSection = document.getElementById('series-episodes-section');
            const videoFileInput = document.getElementById('videoFile');
            const editId = document.getElementById('addContentForm').dataset.editId;

            if (type === 'movie') {
                movieSection.style.display = 'flex';
                videoFileInput.required = !editId; 
                seriesSection.style.display = 'none';
            } else if (type === 'series') {
                movieSection.style.display = 'none'; 
                videoFileInput.required = false; 
                seriesSection.style.display = 'block';
            } else {
                movieSection.style.display = 'none';
                videoFileInput.required = false;
                seriesSection.style.display = 'none';
            }
        }

        async function populateForm(contentId) {
            try {
                const response = await fetch(`/api/content/${contentId}`);
                if (!response.ok) throw new Error('Content not found');
                const data = await response.json();

                document.querySelector('h1').textContent = 'Edit Content';
                const submitButton = document.querySelector('button[type="submit"]');
                submitButton.textContent = 'Update Content';

                const form = document.getElementById('addContentForm');
                form.dataset.editId = data.id; 
                
                document.getElementById('uniqueId').value = data.id || '';
                document.getElementById('uniqueId').readOnly = true; 
                document.getElementById('uniqueId').style.backgroundColor = '#555';
                document.getElementById('title').value = data.title || '';
                document.getElementById('type').value = data.type || 'movie';
                document.getElementById('year').value = data.year || '';
                document.getElementById('category').value = data.category || '';
                document.getElementById('director').value = data.director || '';
                document.getElementById('info').value = data.info || '';

                if (data.actors && Array.isArray(data.actors)) {
                    document.getElementById('actors_names').value = data.actors.map(a => a.name).join('\n');
                    document.getElementById('actors_urls').value = data.actors.map(a => a.wikipediaUrl).join('\n');
                }

                document.querySelector('label[for="posterImage"]').textContent = 'Poster (Leave blank to keep existing)';
                document.querySelector('label[for="backdropImage"]').textContent = 'Backdrop (Leave blank to keep existing)';
                document.querySelector('label[for="videoFile"]').textContent = 'Trailer (Leave blank to keep existing)';
                
                document.getElementById('posterImage').required = false;
                document.getElementById('backdropImage').required = false;
                document.getElementById('videoFile').required = false;

                handleTypeChange();
                

            } catch (err) {
                console.error('Failed to load content for editing:', err);
                document.getElementById('message').textContent = 'Failed to load content: ' + err.message;
                document.getElementById('message').classList.remove('d-none', 'alert-success');
                document.getElementById('message').classList.add('alert-danger');
            }
        }
    
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('type').addEventListener('change', handleTypeChange);
            
            document.getElementById('add-episode-btn').addEventListener('click', addEpisodeRow);

            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit'); 

            if (editId) {
                populateForm(editId);
            } else {
                handleTypeChange();
            }
        });

        document.getElementById('addContentForm').addEventListener('submit', async function(event) {
            event.preventDefault(); 

            const form = event.target;
            const formData = new FormData(form);
            const messageDiv = document.getElementById('message');
            const submitButton = form.querySelector('button[type="submit"]');

            const editId = form.dataset.editId;
            const isEditMode = !!editId; 

            const url = isEditMode ? `/admin/edit-content/${editId}` : '/admin/add-content';
            const method = 'POST';
            const buttonText = isEditMode ? 'Update Content' : 'Add Content';

            submitButton.disabled = true;
            submitButton.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ${isEditMode ? 'Updating...' : 'Adding...'}`;

            try {
                const response = await fetch(url, { 
                    method: method,
                    body: formData 
                });

                const responseText = await response.text();
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (jsonError) {
                    if (!response.ok) {
                        throw new Error(responseText || `Server error: ${response.status}`);
                    }
                    result = { message: "Success, but server response was not valid JSON." };
                }

                if (response.ok) {
                    messageDiv.classList.remove('d-none', 'alert-danger');
                    messageDiv.classList.add('alert-success');
                    messageDiv.textContent = result.message || "Operation successful!";
                    form.reset(); 
                    
                    submitButton.disabled = false;
                    submitButton.textContent = buttonText;

                    setTimeout(() => {
                        window.location.href = '/'; 
                    }, 2000); 
                } else {
                    throw new Error(result.error || 'An unknown error occurred.');
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                messageDiv.classList.remove('d-none', 'alert-success');
                messageDiv.classList.add('alert-danger');
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = error.message;
                const cleanError = tempDiv.textContent || tempDiv.innerText || error.message;
                
                const errorLines = cleanError.split('\n');
                messageDiv.textContent = errorLines[0] || "An error occurred."; 

                submitButton.disabled = false;
                submitButton.textContent = buttonText;
            }
        });
    </script>
</body>
</html>
